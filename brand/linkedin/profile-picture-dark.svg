<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#141110"/>
  <!-- mark box occupies 450/800 = 0.5625 of the canvas — same margin ratio as
       the shipped 225-in-400 composition, so the stroke survives LinkedIn's
       circle and rounded-square crops -->
  <svg x="175" y="175" width="450" height="450" viewBox="0 0 64 64" fill="none">
    <polyline points="14,14 50,14 50,23 38,23 38,32 26,32 26,41 14,41 14,50 50,50"
      stroke="#e07830" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  </svg>
</svg>
